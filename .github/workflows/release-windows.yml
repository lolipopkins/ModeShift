name: Windows release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-build.txt
      - name: Install build dependencies
        shell: pwsh
        run: python -m pip install -r requirements-build.txt
      - name: Test
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Check release version matches application
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = python -c "import sys;sys.path.insert(0,'src');import updater;print(updater.VERSION)"
          if ("v$version" -ne '${{ github.ref_name }}') { throw "Tag doesn't match application version $version" }
      - name: Build portable Windows EXE
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name ModeShift --icon assets/modeshift.ico --add-data "assets/modeshift.ico;assets" --collect-all psutil src/modeshift.py
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          $v = python -c "import sys;sys.path.insert(0,'src');import updater;print(updater.VERSION)"
          & $iscc ('/DAppVersion=' + $v) 'installer\ModeShift.iss'
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
          if (!(Test-Path 'dist/ModeShiftSetup.exe')) { throw 'Installer missing' }
      - name: Generate signed-content digest manifest
        shell: pwsh
        run: |
          $installerHash = (Get-FileHash -Algorithm SHA256 dist/ModeShiftSetup.exe).Hash.ToLowerInvariant()
          $hash = (Get-FileHash -Algorithm SHA256 dist/ModeShift.exe).Hash.ToLowerInvariant()
          $v = python -c "import sys;sys.path.insert(0,'src');import updater;print(updater.VERSION)"
          $manifest = @{ version=$v; url="https://github.com/${{ github.repository }}/releases/download/v$v/ModeShift.exe"; sha256=$hash; installer_url="https://github.com/${{ github.repository }}/releases/download/v$v/ModeShiftSetup.exe"; installer_sha256=$installerHash; notes="ModeShift v$v Windows portable release" } | ConvertTo-Json
          $manifest | Set-Content -Path dist/latest.json -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: ModeShift-Windows-EXE
          path: |
            dist/ModeShift.exe
            dist/ModeShiftSetup.exe
            dist/latest.json
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create '${{ github.ref_name }}' dist/ModeShift.exe dist/ModeShiftSetup.exe dist/latest.json --title 'ModeShift ${{ github.ref_name }}' --notes 'Windows setup installer + portable EXE. The application saves your settings in %LOCALAPPDATA%\ModeShift. Keep a backup before updating.' --verify-tag
