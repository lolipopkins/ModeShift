name: Windows release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - '.github/release-requests/**'
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-build.txt
      - name: Install build dependencies
        shell: pwsh
        run: python -m pip install -r requirements-build.txt -r requirements-qt-preview.txt
      - name: Test
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Check release version matches application
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = python -c "import sys;sys.path.insert(0,'src');import updater;print(updater.VERSION)"
          if ("v$version" -ne '${{ github.ref_name }}') { throw "Tag doesn't match application version $version" }
      - name: Build portable Windows EXE
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name ModeShift --icon assets/modeshift.ico --add-data "assets/modeshift.ico;assets" --collect-all psutil --collect-all PySide6 src/qt_frontend.py
      - name: Build portable EXE separately
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --distpath dist-portable --name ModeShift --icon assets/modeshift.ico --add-data "assets/modeshift.ico;assets" --collect-all psutil --collect-all PySide6 src/qt_frontend.py
      - name: Verify packaged Qt startup
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $exe = (Resolve-Path 'dist/ModeShift/ModeShift.exe').Path
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $p.Refresh()
          if ($p.HasExited) { throw "Installed-layout Qt app crashed at startup (exit $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
      - name: Verify Qt UI and navigation
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          @'
          import sys
          sys.path.insert(0,'src')
          from PySide6.QtWidgets import QApplication
          from qt_frontend import Window
          app=QApplication([])
          w=Window()
          app.processEvents()
          assert len(w.page_names)==9
          for page in w.page_names:
              w.show_page(page)
              assert w.nav_buttons[page].property('active') is True
          w.telemetry.stop()
          w.close()
          print('Qt nine-page UI smoke test passed')
          '@ | python -
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          $v = python -c "import sys;sys.path.insert(0,'src');import updater;print(updater.VERSION)"
          & $iscc ('/DAppVersion=' + $v) 'installer\ModeShift.iss'
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
          if (!(Test-Path 'dist/ModeShiftSetup.exe')) { throw 'Installer missing' }
      - name: Generate signed-content digest manifest
        shell: pwsh
        run: |
          $installerHash = (Get-FileHash -Algorithm SHA256 dist/ModeShiftSetup.exe).Hash.ToLowerInvariant()
          $hash = (Get-FileHash -Algorithm SHA256 dist-portable/ModeShift.exe).Hash.ToLowerInvariant()
          $v = python -c "import sys;sys.path.insert(0,'src');import updater;print(updater.VERSION)"
          $manifest = @{ version=$v; url="https://github.com/${{ github.repository }}/releases/download/v$v/ModeShift.exe"; sha256=$hash; installer_url="https://github.com/${{ github.repository }}/releases/download/v$v/ModeShiftSetup.exe"; installer_sha256=$installerHash; notes="ModeShift v$v Windows portable release" } | ConvertTo-Json
          $manifest | Set-Content -Path dist/latest.json -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: ModeShift-Windows-EXE
          path: |
            dist-portable/ModeShift.exe
            dist/ModeShift/**
            dist/ModeShiftSetup.exe
            dist/latest.json
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = python -c "import sys;sys.path.insert(0,'src');import updater;print(updater.VERSION)"
          $tag = "v$version"
          if (gh release view $tag 2>$null) {
            gh release upload $tag dist-portable/ModeShift.exe dist/ModeShiftSetup.exe dist/latest.json --clobber
          } else {
            gh release create $tag dist-portable/ModeShift.exe dist/ModeShiftSetup.exe dist/latest.json --title "ModeShift $tag" --notes "Windows setup installer and portable EXE; settings preserved in AppData." --target $env:GITHUB_SHA
          }
          if ($LASTEXITCODE -ne 0) { throw "Release publishing failed" }
