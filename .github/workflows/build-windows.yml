name: Build ModeShift for Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name ModeShift --icon assets/modeshift.ico --add-data "assets/modeshift.ico;assets" --collect-all psutil src/modeshift.py
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          $compiler = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe'
          $version = python -c "import sys;sys.path.insert(0,'src');import updater;print(updater.VERSION)"
          & $compiler ('/DAppVersion=' + $version) 'installer\ModeShift.iss'
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: ModeShift-Windows
          path: |
            dist/ModeShift.exe
            dist/ModeShiftSetup.exe
