name: Build ModeShift Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements-build.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean --onedir --windowed --name ModeShift --icon assets/modeshift.ico --add-data "assets/modeshift.ico;assets" --collect-all psutil src/modeshift.py
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Build setup installer
        shell: pwsh
        run: |
          $iscc = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe'
          $v = python -c "import sys;sys.path.insert(0,'src');import updater;print(updater.VERSION)"
          & $iscc ('/DAppVersion=' + $v) 'installer\ModeShift.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: ModeShift-INSTALLER
          path: dist/ModeShiftSetup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ModeShift-PORTABLE
          path: dist/ModeShift.exe
          if-no-files-found: error
